name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: docking-universal
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
      - name: Run CLI checks
        shell: bash -el {0}
        run: make test
