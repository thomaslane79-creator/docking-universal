name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: docking-universal
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
      - name: Run CLI checks
        shell: bash -el {0}
        run: make test
      - name: Create and verify docking engine environments
        shell: bash -el {0}
        run: |
          conda env create -f environments/vina.yml
          conda env create -f environments/qvinaw.yml
          conda run --no-capture-output -n docking-universal-vina vina --version
          conda run --no-capture-output -n docking-universal-qvinaw qvinaw --version
      - name: Run real-tool integration validation
        shell: bash -el {0}
        run: make test-integration

  native-portability-foundations:
    name: Native safety contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native process locks and atomic state transactions
        # A native Windows interpreter, not Git Bash/WSL or a mocked platform.
        # These are foundations only, not installation/GPU acceptance.
        env:
          PYTHONPATH: libexec
        run: python -m unittest tests.test_file_lock tests.test_state_transactions tests.test_browser_runtime tests.test_runtime_layout tests.test_host_client tests.test_native_entrypoint tests.test_native_bootstrap_manager tests.test_native_validation tests.test_windows_job tests.test_windows_activation tests.test_process_adapter tests.test_process_runner tests.test_native_scientific tests.test_windows_scientific_install tests.test_windows_viewer_runtime tests.test_windows_qvinaw tests.test_receptor_filter_native tests.test_p2rank_runtime tests.test_tool_commands tests.test_native_preparation tests.test_windows_desktop tests.test_vina_cli
      - name: Native Meeko exact-file transport
        env:
          PYTHONPATH: libexec
        run: python -m unittest tests.test_meeko_export

  native-windows-bootstrap:
    name: Native Windows bootstrap and Qt host (not full scientific app)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: No-prerequisite private bootstrap, actual Qt window, host and prepared Vina
        shell: powershell
        run: |
          & "$env:pythonLocation\python.exe" validation/native_windows_bootstrap.py --out "$env:RUNNER_TEMP\du-native-bootstrap" --without-prerequisites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain status only, not screenshots, studies or docking outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-bootstrap-status
          retention-days: 7
          path: |
            ${{ runner.temp }}/du-native-bootstrap/summary.json

  older-macos-gpu-host-build:
    name: Older macOS candidate host build (not GPU acceptance)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build unchanged patched kernels for macOS 15 and test native loading
        run: python validation/build_adgpu_compatibility.py --out "${{ runner.temp }}/adgpu-compat"
      - name: Retain build metadata and log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: older-macos-gpu-host-build
          retention-days: 7
          path: |
            ${{ runner.temp }}/adgpu-compat/build.json
            ${{ runner.temp }}/adgpu-compat/build.log
            ${{ runner.temp }}/adgpu-compat/native-help.log

  native-windows-vina-adapter:
    name: Native Windows prepared-input Vina adapter (not full app)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify official binary and run synthetic same-seed adapter checks
        run: python validation/native_windows_vina.py --out "${{ runner.temp }}/du-vina-native"
      - name: Retain execution status only, not structures or docked poses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-vina-adapter-status
          retention-days: 7
          path: |
            ${{ runner.temp }}/du-vina-native/summary.json
