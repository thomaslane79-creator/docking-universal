name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install rdkit==2023.9.6
      - name: Run CLI checks
        run: make test
