name: native-windows-scientific

on:
  push:
    paths:
      - environment.yml
      - install-windows.ps1
      - tools/install_native_windows.py
      - environments/windows-gui.yml
      - libexec/docking_universal/windows_viewer_runtime.py
      - libexec/docking_universal/viewer/**
      - libexec/docking_universal/gui/interaction_review_window.py
      - libexec/docking-universal-desktop.py
      - dependencies/runtime/windows-x64/**
      - validation/native_viewer_probe.py
      - dependencies/p2rank.json
      - libexec/docking_universal/windows_scientific_install.py
      - libexec/docking_universal/windows_scientific_runtime.py
      - libexec/docking_universal/native_entrypoint.py
      - libexec/docking_universal/windows_desktop.py
      - libexec/docking-universal-prepare-native.py
      - libexec/docking-universal-application-host.py
      - libexec/docking_universal/host.py
      - libexec/docking_universal/orchestration.py
      - libexec/docking_universal/processes.py
      - libexec/docking_universal/state.py
      - tests/test_state_transactions.py
      - libexec/docking_universal/vina_cli.py
      - libexec/docking_universal_dock.py
      - validation/native_windows_vina.py
      - tests/test_vina_cli.py
      - libexec/docking_universal/gui/desktop.py
      - libexec/docking_universal/gui/workflow_panels.py
      - environments/windows-bootstrap-gui.yml
      - validation/native_windows_bootstrap.py
      - validation/native_windows_host_probe.py
      - validation/native_windows_desktop_workflow.py
      - validation/native_windows_scientific.py
      - validation/native_scientific_workflow.py
      - validation/p2rank_argument_transport.py
      - validation/native_science_dispatch.py
      - libexec/docking_universal/native_preparation.py
      - libexec/docking_universal/p2rank_runtime.py
      - libexec/docking_universal/tool_commands.py
      - libexec/docking_universal/plip_runtime.py
      - libexec/docking-universal-interactions.py
      - tests/test_native_interaction_command.py
      - libexec/docking_universal/sdf_io.py
      - tests/test_sdf_io.py
      - libexec/docking_universal/poseedit_renderer/render.cjs
      - .github/workflows/native-scientific.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-scientific-gate:
    name: Native Windows installed science and Qt workflow (not interactive viewer acceptance)
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Private default installation with Python and Conda absent from installer PATH
        shell: powershell
        run: |
          & "$env:pythonLocation\python.exe" validation/native_windows_bootstrap.py --out "$env:RUNNER_TEMP\du-installed-scientific" --without-prerequisites --with-scientific
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain status only; never structures, scientific logs, screenshots or reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-installed-scientific-status
          retention-days: 7
          path: |
            ${{ runner.temp }}/du-installed-scientific/summary.json
            ${{ runner.temp }}/du-installed-scientific/installed-scientific/summary.json
            ${{ runner.temp }}/du-installed-scientific/desktop-workflow/summary.json
            ${{ runner.temp }}/du-installed-scientific/installed-viewer/summary.json

  scientific-dependency-gate:
    name: Native Windows pinned scientific dependencies (not full workflow)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: false
          conda-remove-defaults: true
      - name: Solve, install and import the unchanged scientific package pins
        shell: powershell
        run: |
          & "$env:CONDA\python.exe" validation/native_windows_scientific.py --out "$env:RUNNER_TEMP\du-native-scientific" --conda "$env:CONDA\Scripts\conda.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain dependency metadata only; no structures or docking outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-scientific-dependency-status
          retention-days: 7
          path: |
            ${{ runner.temp }}/du-native-scientific/summary.json
            ${{ runner.temp }}/du-native-scientific/solve.stdout.json
            ${{ runner.temp }}/du-native-scientific/solve.stderr.log
            ${{ runner.temp }}/du-native-scientific/probe.stdout.json
            ${{ runner.temp }}/du-native-scientific/probe.stderr.log
      - name: Rehearse native public receptor preparation through docking and reports
        shell: powershell
        run: |
          $scientific = "$env:RUNNER_TEMP\du-native-scientific\Native scientific test\scientific"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\libexec"
          & "$env:CONDA\Scripts\conda.exe" run --no-capture-output --prefix $scientific python -m unittest tests.test_sdf_io tests.test_native_interaction_command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:CONDA\Scripts\conda.exe" run --no-capture-output --prefix $scientific python validation/native_scientific_workflow.py --out "$env:RUNNER_TEMP\du-native-workflow"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain stage status only; all structures, reports and tool logs stay local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-scientific-workflow-status
          retention-days: 7
          path: ${{ runner.temp }}/du-native-workflow/summary.json
