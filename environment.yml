name: docking-universal
channels:
  - conda-forge
dependencies:
  # Direct, stage-level dependencies exercised on Ubuntu and macOS.
  - python=3.9.23
  # Used by install.sh to install and validate the public command. Declaring it
  # here avoids requiring developer command-line tools on a new workstation.
  - make
  - fpocket=4.2.2
  - openbabel=3.1.1
  - plip=2.3.1
  - pymol-open-source=3.0.0
  - rdkit=2023.09.6
  - molscrub=0.2.2
  - pdbfixer=1.11
  # Meeko 0.7.1 imports gemmi for receptor chemical templates but does not
  # declare it in its pip package metadata, so keep it explicit here.
  - gemmi
  - pycairo=1.27.0
  - pip
  - pip:
      - meeko==0.7.1
      - reportlab==4.2.5
