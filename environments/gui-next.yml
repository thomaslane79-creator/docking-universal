name: docking-universal-gui-next
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Parallel modernization candidate.  Keep the validated Python 3.9
  # environment intact until the real GUI/PyMOL compatibility matrix passes.
  - python=3.12
  - pyqt6
  - gemmi
  - rdkit
  - numpy
  - scipy
  - pillow
  - reportlab
  - pycairo
  # ABI dependencies of the relocatable Apple-Silicon embedded PyMOL wheel.
  # No Qt5 PyMOL package is installed into this Qt6 environment.
  - glew=2.3.0
  - freetype>=2.14
  - libpng>=1.6
  - nodejs=22
  - pip
